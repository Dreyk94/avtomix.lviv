<svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2a1d"/>
      <stop offset="55%" stop-color="#123d29"/>
      <stop offset="100%" stop-color="#0a2118"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a3d"/>
      <stop offset="100%" stop-color="#e0432b"/>
    </linearGradient>
    <linearGradient id="roadFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1f22"/>
      <stop offset="100%" stop-color="#0d0f11"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#glow)"/>

  <!-- Faint world-map dot grid, top area -->
  <g fill="#ffffff" opacity="0.10">
    <g id="dotsA">
      <circle cx="1180" cy="120" r="4"/><circle cx="1205" cy="110" r="4"/><circle cx="1230" cy="118" r="4"/>
      <circle cx="1160" cy="145" r="4"/><circle cx="1188" cy="140" r="4"/><circle cx="1215" cy="150" r="4"/><circle cx="1245" cy="142" r="4"/>
      <circle cx="1175" cy="172" r="4"/><circle cx="1205" cy="178" r="4"/><circle cx="1235" cy="170" r="4"/>
      <circle cx="1330" cy="130" r="4"/><circle cx="1358" cy="122" r="4"/><circle cx="1385" cy="132" r="4"/>
      <circle cx="1310" cy="158" r="4"/><circle cx="1340" cy="165" r="4"/><circle cx="1368" cy="160" r="4"/><circle cx="1395" cy="168" r="4"/>
      <circle cx="1325" cy="190" r="4"/><circle cx="1355" cy="196" r="4"/>
      <circle cx="1420" cy="200" r="4"/><circle cx="1448" cy="192" r="4"/><circle cx="1475" cy="205" r="4"/>
      <circle cx="1440" cy="228" r="4"/><circle cx="1468" cy="235" r="4"/>
      <circle cx="1080" cy="230" r="4"/><circle cx="1108" cy="222" r="4"/><circle cx="1060" cy="255" r="4"/><circle cx="1095" cy="260" r="4"/>
    </g>
  </g>

  <!-- large translucent shield emblem -->
  <g transform="translate(1180,90)" opacity="0.16">
    <path d="M180 0 L340 60 L340 230 C340 350 260 430 180 470 C100 430 20 350 20 230 L20 60 Z" fill="none" stroke="#ffffff" stroke-width="10"/>
    <path d="M110 245 L165 300 L265 175" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- winding road across the lower third -->
  <g>
    <path d="M-50 620 C 300 560, 500 700, 850 640 C 1150 590, 1350 660, 1700 610 L1700 800 L-50 800 Z" fill="url(#roadFill)"/>
    <path d="M-50 620 C 300 560, 500 700, 850 640 C 1150 590, 1350 660, 1700 610"
          fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6" stroke-dasharray="34 28"/>
  </g>

  <!-- small car silhouette, moving along the road -->
  <g transform="translate(760,560)" fill="#ffffff" opacity="0.85">
    <path d="M0 40 C4 18 24 6 48 6 L150 6 C176 6 196 20 204 40 L226 42 C238 44 246 54 246 66 L246 78 C246 86 240 92 232 92 L18 92 C10 92 4 86 4 78 L4 66 C4 56 10 48 20 44 Z"/>
    <circle cx="55" cy="94" r="20" fill="#0b2a1d"/>
    <circle cx="55" cy="94" r="9" fill="#ffffff"/>
    <circle cx="195" cy="94" r="20" fill="#0b2a1d"/>
    <circle cx="195" cy="94" r="9" fill="#ffffff"/>
    <path d="M56 40 L72 12 L134 12 L146 40 Z" fill="#123d29"/>
  </g>

  <!-- scattered accent dots for texture -->
  <g fill="#ff7a3d" opacity="0.35">
    <circle cx="980" cy="470" r="5"/>
    <circle cx="1040" cy="500" r="4"/>
    <circle cx="1010" cy="520" r="3"/>
  </g>
</svg>
